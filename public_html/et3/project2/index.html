<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
>

<a-assets>

<a-asset-item
id="characterModel"
src="./character.glb">
</a-asset-item>

<audio id="popSound" src="./assets/shine.mp3"></audio>

</a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<!-- MARKER 1 -->
<a-entity mindar-image-target="targetIndex: 0">

<a-gltf-model
id="character"
src="#characterModel"
position="0 0 0.1"
scale="0.3 0.3 0.3"
rotation="0 0 0"
animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
</a-gltf-model>

</a-entity>

<!-- MARKER 2 -->
<a-entity mindar-image-target="targetIndex: 1">

<a-text
value="LHI"
color="purple"
text-align="center"
position="0 0 0"
animation="property: position; to: 0 0.2 0; dir: alternate; loop: true; dur: 1000">
</a-text>

</a-entity>

<!-- MARKER 3 -->
<a-entity mindar-image-target="targetIndex: 2">

<a-sphere
color="pink"
radius="0.2"
position="0 0 0"
animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 800">
</a-sphere>

</a-entity>

</a-scene>
<script>

  document.querySelector('#character').addEventListener('click', () => {
  
  const sound = document.querySelector('#shineSound');
  
  sound.play();
  
  document.querySelector('#character').setAttribute(
  'animation',
  'property: scale; to: 0.4 0.4 0.4; dir: alternate; dur: 300'
  );
  
  });
  
  </script>
</body>
</html>
