<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF:0.0001;
    filterBeta: 0.001;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true,
    physicallyCorrectLights
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>

  <a-assets>

    <a-asset-item
      id="cyborgModel"
      src="./models/cyborg.glb">
    </a-asset-item>

    <a-asset-item
      id="brainModel"
      src="./models/brain.glb">
    </a-asset-item>

    <a-asset-item
      id="heartModel"
      src="./models/heart.glb">
    </a-asset-item>

    <audio
      id="heartSound"
      src="./sounds/heartbeat.mp3">
    </audio>

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity mindar-image-target="targetIndex: 0">



    <a-gltf-model

      id="cyborg"

      src="#cyborgModel"

      position="-0.28 -0.05 0.1"

      rotation="0 0 0"

      scale="0.22 0.22 0.22"

      animation="
        property: rotation;
        to: 0 360 0;
        loop: true;
        dur: 8000;
        easing: linear;
      "

      class="clickable"

    >
    </a-gltf-model>


    <a-gltf-model

      id="brain"

      src="#brainModel"

      position="0.32 0.22 0.1"

      rotation="0 0 0"

      scale="0.09 0.09 0.09"

      animation="
        property: position;
        to: 0.32 0.26 0.1;
        dir: alternate;
        loop: true;
        dur: 1500;
        easing: easeInOutSine;
      "

      class="clickable"

    >
    </a-gltf-model>


    <a-gltf-model

      id="heart"

      src="#heartModel"

      position="0.32 -0.30 0.1"

      rotation="0 0 0"

      scale="0.10 0.10 0.10"

      animation="
        property: scale;
        to: 0.12 0.12 0.12;
        dir: alternate;
        loop: true;
        dur: 700;
        easing: easeInOutQuad;
      "

      class="clickable"

    >
    </a-gltf-model>


    <a-light
      type="ambient"
      intensity="1">
    </a-light>

  </a-entity>

</a-scene>



<script>

  const cyborg = document.querySelector('#cyborg');

  cyborg.addEventListener('click', () => {

    cyborg.setAttribute(
      'animation__spin',
      `
      property: rotation;
      to: 0 720 0;
      dur: 1500;
      easing: easeInOutQuad;
      `
    );

  });



  const brain = document.querySelector('#brain');

  brain.addEventListener('click', () => {

    brain.setAttribute(
      'animation__pulse',
      `
      property: scale;
      to: 0.12 0.12 0.12;
      dir: alternate;
      loop: 2;
      dur: 300;
      `
    );

  });


  const heart = document.querySelector('#heart');

  const heartSound = document.querySelector('#heartSound');

  heart.addEventListener('click', () => {

    heartSound.play();

    heart.setAttribute(
      'animation__shake',
      `
      property: rotation;
      to: 0 0 15;
      dir: alternate;
      loop: 6;
      dur: 150;
      `
    );

  });

</script>

</body>

</html>
